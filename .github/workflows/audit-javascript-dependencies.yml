name: Audit dependencies

on:
  pull_request:
    branches: ["main"]
    paths: "**/pnpm-lock.yaml"

jobs:
  audit-javascript-dependencies:
    permissions:
      contents: read
      pull-requests: write
    uses: alextheman231/github-actions/.github/workflows/audit-javascript-dependencies.yml@b2f0b2147ee6559019c8379f381d982bf0644381 # v14.1.0
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      node-version: 26
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
