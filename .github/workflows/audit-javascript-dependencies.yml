name: Audit dependencies

on:
  pull_request:
    branches: ["main"]
    paths: "**/pnpm-lock.yaml"

jobs:
  audit-javascript-dependencies:
    permissions:
      contents: read
      pull-requests: write
    uses: alextheman231/github-actions/.github/workflows/audit-javascript-dependencies.yml@75de70d1e8537c1a680c5628b4f08521e4ddc617 # v12.9.0
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      node-version: 26
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
