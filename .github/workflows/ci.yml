name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lexicon-lint-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Cache Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/.turbo"
          key: turbo-lint-${{ hashFiles('{apps,packages}/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}
          restore-keys: turbo-lint-

      - name: Install dependencies
        run: pnpm install

      - name: Build projects
        run: pnpm run build

      - name: Run linting checks
        run: pnpm run lint

  lexicon-test-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lexicon
          POSTGRES_DB: tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Cache Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/.turbo"
          key: turbo-test-${{ hashFiles('{apps,packages}/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}
          restore-keys: turbo-test-

      - name: Initialise environment variables
        run: |
          touch apps/back-end/.env.test
          echo DATABASE_URL="postgresql://postgres:lexicon@localhost:5432/tests?schema=public" >> apps/back-end/.env.test
          echo API_BASE_URL="http://localhost:5432" >> apps/back-end/.env.test

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build

      - name: Apply migrations
        run: pnpm run migrate-db
        working-directory: apps/back-end
        env:
          NODE_ENV: test

      - name: Run tests
        run: pnpm test

  end-to-end-ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lexicon
          POSTGRES_DB: end-to-end
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Cache Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/.turbo"
          key: turbo-end-to-end-${{ hashFiles('{apps,packages}/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}
          restore-keys: turbo-end-to-end-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/end-to-end/playwright.config.ts') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: apps/end-to-end
        run: pnpm exec playwright install --with-deps

      - name: Initialise back-end environment variables
        run: |
          touch apps/back-end/.env.end-to-end
          echo DATABASE_URL="postgresql://postgres:lexicon@localhost:5432/end-to-end?schema=public" >> apps/back-end/.env.end-to-end
          echo PORT="9090" >> apps/back-end/.env.end-to-end
          echo API_BASE_URL="http://localhost:9090" >> apps/back-end/.env.end-to-end

      - name: Build packages
        run: pnpm run build-packages

      - name: Build apps for static serving
        run: pnpm run build-static

      - name: Apply migrations
        run: pnpm run migrate-db
        working-directory: apps/back-end
        env:
          NODE_ENV: end-to-end

      - name: Load the dev data
        run: pnpm run seed-db
        working-directory: apps/back-end
        env:
          NODE_ENV: end-to-end

      - name: Run Playwright tests
        working-directory: apps/end-to-end
        run: pnpm test

      - name: Upload Playwright reports to workflow output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/end-to-end/playwright-report/
          retention-days: 30

      - name: Upload test results to workflow output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: apps/end-to-end/test-results/
          retention-days: 30

  actions-ci:
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@760f1347c1597e458ce3e966112d7278ed15c059 # v12.5.1
