name: Change request

on:
  workflow_dispatch:
    inputs:
      reason:
        description: A short explanation for the reason behind the change.
        required: true
        default: Redeploy Lexicon
      description:
        description: A further description of the change.
        required: false
        default: Trigger a redeployment of Lexicon.
      branch_name:
        description: The branch name to use
        required: false
        default: change-request
      labels:
        description: The labels to use on the pull request, given as a comma-separated list
        required: false
        default: "medium risk"

jobs:
  create-change-request:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    uses: alextheman231/github-actions/.github/workflows/create-change-request.yml@b2f0b2147ee6559019c8379f381d982bf0644381 # v14.1.0
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      actor: ${{ github.actor }}
      reason: ${{ inputs.reason }}
      description: ${{ inputs.description }}
      branch_name: ${{ inputs.branch_name }}
      labels: ${{ inputs.labels }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
