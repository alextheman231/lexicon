name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-image:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/lexicon:latest

  deploy-app:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    permissions:
      contents: read
    env:
      SENTRY_RELEASE: ${{ github.sha }}
    needs: [deploy-image]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache Turborepo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: "**/.turbo"
          key: turbo-deploy-${{ hashFiles('{apps,packages}/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}
          restore-keys: turbo-deploy-

      - name: Install dependencies
        run: pnpm install

      - name: Install Render CLI
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh

      - name: Build packages
        run: pnpm run build

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: render deploys create $RENDER_SERVICE_ID --wait --confirm

      - name: Apply migrations
        working-directory: apps/back-end
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm run migrate-db

      - name: Create Sentry release for back-end
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ORGANISATION_TOKEN }}
          SENTRY_ORG: alextheman231
          SENTRY_PROJECT: lexicon-back-end
        with:
          environment: production
          release: ${{ env.SENTRY_RELEASE }}
          ignore_missing: true
          ignore_empty: true

      - name: Create Sentry release for front-end
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ORGANISATION_TOKEN }}
          SENTRY_ORG: alextheman231
          SENTRY_PROJECT: lexicon-front-end
        with:
          environment: production
          release: ${{ env.SENTRY_RELEASE }}
          sourcemaps: apps/front-end/dist/assets
          ignore_missing: true
          ignore_empty: true
