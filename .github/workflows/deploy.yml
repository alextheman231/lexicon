name: Deploy Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-sentry:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    permissions:
      contents: read
    env:
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Cache Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/.turbo"
          key: turbo-deploy-${{ hashFiles('{apps,packages}/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}
          restore-keys: turbo-deploy-

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build-packages

      - name: Build apps for static serving
        run: pnpm run build-static

      - name: Create Sentry release for back-end
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ORGANISATION_TOKEN }}
          SENTRY_ORG: alextheman231
          SENTRY_PROJECT: lexicon-back-end
        with:
          environment: production
          release: ${{ env.SENTRY_RELEASE }}
          sourcemaps: apps/back-end/dist
          ignore_missing: true
          ignore_empty: true

      - name: Create Sentry release for front-end
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ORGANISATION_TOKEN }}
          SENTRY_ORG: alextheman231
          SENTRY_PROJECT: lexicon-front-end
        with:
          environment: production
          release: ${{ env.SENTRY_RELEASE }}
          sourcemaps: apps/back-end/public/assets
          ignore_missing: true
          ignore_empty: true

  deploy-image:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push Docker image to ECR
        env:
          AWS_ECR_REPOSITORY_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
          FRONT_END_SENTRY_DSN: ${{ vars.FRONT_END_SENTRY_DSN }}
        run: |
          docker build \
            --build-arg GITHUB_SHA="$IMAGE_TAG" \
            --build-arg FRONT_END_SENTRY_DSN="$FRONT_END_SENTRY_DSN"
            -t "$AWS_ECR_REPOSITORY_URL:$IMAGE_TAG" \
            -t "$AWS_ECR_REPOSITORY_URL:latest" \
            .

          docker push "$AWS_ECR_REPOSITORY_URL:$IMAGE_TAG"
          docker push "$AWS_ECR_REPOSITORY_URL:latest"

  deploy-migrations:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'alextheman231/lexicon' }}
    permissions:
      contents: read
      id-token: write
    needs: [deploy-sentry, deploy-image]
    steps:
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply migrations
        id: migration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
          AWS_MIGRATION_TASK_FAMILY: ${{ vars.AWS_MIGRATION_TASK_FAMILY }}
          AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
          AWS_SUBNET_IDS: ${{ vars.AWS_SUBNET_IDS }}
          AWS_ASSIGN_PUBLIC_IP: ${{ vars.AWS_ASSIGN_PUBLIC_IP }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$AWS_CLUSTER_NAME" \
            --task-definition "$AWS_MIGRATION_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$AWS_SUBNET_IDS],securityGroups=[$AWS_SECURITY_GROUP_ID],assignPublicIp=$AWS_ASSIGN_PUBLIC_IP}" \
            --query 'tasks[0].taskArn' \
            --output text
          )

          if [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start migration task."
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migrations to apply successfully
        env:
          AWS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
          TASK_ARN: ${{ steps.migration.outputs.task_arn }}
        run: |
          START_TIME=$(date +%s)

          while true; do
            TASK_INFO=$(aws ecs describe-tasks \
              --cluster "$AWS_CLUSTER_NAME" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].{
                StopReason:stoppedReason,
                ExitCode:containers[0].exitCode,
                Reason:containers[0].reason,
                LastStatus:containers[0].lastStatus
              }' \
              --output json
            )
            CURRENT_STATUS=$(jq -r '.LastStatus' <<<"$TASK_INFO")
            EXIT_CODE=$(jq -r '.ExitCode' <<<"$TASK_INFO")
            
            ELAPSED=$(( $(date +%s) - START_TIME ))
            echo "Current status: $CURRENT_STATUS (${ELAPSED}s elapsed)"

            if [[ "$CURRENT_STATUS" == "STOPPED" ]]; then
              echo "$TASK_INFO"

              if [[ "$EXIT_CODE" == "None" ]]; then
                echo "Migration task stopped without reporting an exit code."
                exit 1
              fi

              exit "$EXIT_CODE"
            fi

            sleep 10
          done

  deploy-app:
    needs: [deploy-migrations]
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy-ecs.yml
    with:
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
      aws_cluster_name: ${{ vars.AWS_CLUSTER_NAME }}
      aws_service_name: ${{ vars.AWS_APP_SERVICE_NAME }}

  deploy-workers:
    needs: [deploy-migrations]
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/deploy-ecs.yml
    with:
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
      aws_cluster_name: ${{ vars.AWS_CLUSTER_NAME }}
      aws_service_name: ${{ vars.AWS_WORKERS_SERVICE_NAME }}
